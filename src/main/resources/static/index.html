<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>业务 AI 助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyonight-dark.min.css">
    <style>
        :root {
            --bg: #0b1220;
            --bg-2: #111b31;
            --panel: rgba(13, 22, 39, 0.88);
            --panel-soft: rgba(27, 39, 63, 0.82);
            --line: rgba(148, 163, 184, 0.2);
            --text: #e5edf9;
            --muted: #9fb0ca;
            --accent: #38bdf8;
            --accent-2: #2dd4bf;
            --accent-3: #f59e0b;
            --danger: #f87171;
            --user: linear-gradient(135deg, #0ea5e9, #14b8a6);
            --active: linear-gradient(135deg, rgba(56, 189, 248, 0.34), rgba(45, 212, 191, 0.28));
            --shadow: 0 20px 45px rgba(2, 6, 23, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(56, 189, 248, 0.15), transparent 30%),
                radial-gradient(circle at bottom right, rgba(45, 212, 191, 0.13), transparent 28%),
                linear-gradient(180deg, var(--bg), var(--bg-2));
        }

        button,
        input {
            font: inherit;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: var(--panel);
            border-right: 1px solid var(--line);
            backdrop-filter: blur(18px);
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .brand {
            padding: 6px 8px 2px;
        }

        .brand h1 {
            font-size: 1.28rem;
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        .brand p {
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .primary-btn {
            width: 100%;
            border: none;
            border-radius: 16px;
            padding: 14px 16px;
            color: white;
            background: var(--user);
            cursor: pointer;
            box-shadow: var(--shadow);
            font-weight: 700;
        }

        .primary-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .session-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .session-item {
            width: 100%;
            border: 1px solid rgba(148, 163, 184, 0.12);
            background: rgba(30, 41, 59, 0.55);
            border-radius: 16px;
            padding: 12px 14px;
            cursor: pointer;
            transition: 0.2s ease;
            color: var(--text);
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .session-item:hover {
            transform: translateY(-1px);
            border-color: rgba(56, 189, 248, 0.45);
            background: rgba(56, 189, 248, 0.15);
        }

        .session-item.active {
            background: var(--active);
            border-color: rgba(56, 189, 248, 0.9);
            box-shadow: 0 12px 28px rgba(56, 189, 248, 0.18);
        }

        .session-item.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, var(--accent), var(--accent-2));
        }

        .session-index {
            display: inline-flex;
            align-items: center;
            padding: 4px 9px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(56, 189, 248, 0.18);
            color: #dff4ff;
            border: 1px solid rgba(56, 189, 248, 0.22);
            margin-bottom: 8px;
        }

        .session-item.active .session-index {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .session-name {
            font-size: 0.96rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }

        .session-item.active .session-name {
            color: #ffffff;
        }

        .main {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .header {
            padding: 24px 28px 18px;
            border-bottom: 1px solid var(--line);
            background: rgba(13, 22, 39, 0.62);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 18px;
        }

        .header-copy h2 {
            font-size: 1.18rem;
            font-weight: 800;
        }

        .header-copy p {
            margin-top: 6px;
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .status-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(30, 41, 59, 0.76);
            color: var(--text);
            font-size: 0.82rem;
        }

        .status-badge strong {
            color: #ffffff;
        }

        .user-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--panel-soft);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 10px 14px;
            min-width: 240px;
        }

        .user-box label {
            color: var(--muted);
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .user-box input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            font-size: 0.95rem;
        }

        .assistant-bar {
            display: flex;
            gap: 12px;
            padding: 20px 28px 0;
            flex-wrap: wrap;
        }

        .assistant-card {
            min-width: 220px;
            border: 1px solid rgba(148, 163, 184, 0.16);
            background: var(--panel-soft);
            color: var(--text);
            border-radius: 18px;
            padding: 14px 16px;
            cursor: pointer;
            transition: 0.2s ease;
            text-align: left;
            position: relative;
        }

        .assistant-card:hover {
            transform: translateY(-1px);
            border-color: rgba(45, 212, 191, 0.45);
        }

        .assistant-card.active {
            border-color: rgba(45, 212, 191, 0.92);
            background: linear-gradient(135deg, rgba(45, 212, 191, 0.24), rgba(56, 189, 248, 0.24));
            box-shadow: 0 14px 30px rgba(45, 212, 191, 0.16);
        }

        .assistant-card.active::after {
            content: "当前选中";
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
            font-size: 0.72rem;
            font-weight: 800;
        }

        .assistant-card strong {
            display: block;
            font-size: 0.97rem;
            color: #f8fafc;
        }

        .assistant-card span {
            display: block;
            margin-top: 6px;
            font-size: 0.84rem;
            color: var(--muted);
            line-height: 1.5;
        }

        .assistant-card.active strong,
        .assistant-card.active span {
            color: #ffffff;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .message {
            max-width: min(860px, 88%);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.ai,
        .message.tool_execution_result {
            align-self: flex-start;
        }

        .bubble {
            border-radius: 18px;
            padding: 14px 18px;
            line-height: 1.7;
            word-break: break-word;
            border: 1px solid var(--line);
            background: var(--panel-soft);
            box-shadow: var(--shadow);
        }

        .message.user .bubble {
            border: none;
            color: white;
            background: var(--user);
        }

        .message.tool_execution_result .bubble {
            background: rgba(45, 212, 191, 0.12);
            border-color: rgba(45, 212, 191, 0.35);
        }

        .bubble p,
        .bubble ul,
        .bubble ol,
        .bubble table,
        .bubble pre,
        .bubble blockquote {
            margin: 10px 0;
        }

        .bubble pre {
            overflow-x: auto;
            padding: 12px;
            border-radius: 12px;
            background: rgba(2, 6, 23, 0.7);
        }

        .bubble code {
            background: rgba(2, 6, 23, 0.4);
            padding: 2px 5px;
            border-radius: 6px;
        }

        .bubble pre code {
            background: transparent;
            padding: 0;
        }

        .bubble table {
            width: 100%;
            border-collapse: collapse;
            display: block;
            overflow-x: auto;
        }

        .bubble th,
        .bubble td {
            border: 1px solid var(--line);
            padding: 10px 12px;
            text-align: left;
        }

        .typing-cursor {
            display: inline-block;
            width: 8px;
            height: 18px;
            margin-left: 6px;
            background: var(--accent);
            animation: blink 0.9s infinite;
            vertical-align: middle;
            border-radius: 4px;
        }

        .composer {
            padding: 18px 28px 28px;
        }

        .composer-form {
            display: flex;
            gap: 12px;
            align-items: center;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 10px 12px 10px 18px;
            backdrop-filter: blur(18px);
        }

        .composer-form input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            font-size: 1rem;
        }

        .send-btn {
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--user);
            color: white;
            cursor: pointer;
            font-size: 1.15rem;
            font-weight: 800;
        }

        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        @media (max-width: 960px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                border-right: none;
                border-bottom: 1px solid var(--line);
            }

            .header {
                flex-direction: column;
            }

            .user-box {
                width: 100%;
            }

            .message {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand">
            <h1>业务 AI 助手</h1>
            <p>会话与助手已隔离。左侧选择会话，上方选择助手，当前选中状态会明显高亮。</p>
        </div>
        <button class="primary-btn" id="new-chat-btn">新建会话</button>
        <div class="session-list" id="session-list"></div>
    </aside>

    <main class="main">
        <header class="header">
            <div class="header-copy">
                <h2>选择助手后开始对话</h2>
                <p>字典助手会路由到 <code>DictAssistant</code>，其他普通会话走通用助手。</p>
                <div class="status-row">
                    <div class="status-badge" id="current-session-badge">当前会话: <strong>未选择</strong></div>
                    <div class="status-badge" id="current-assistant-badge">当前助手: <strong>通用助手</strong></div>
                </div>
            </div>
            <div class="user-box">
                <label for="userId">用户</label>
                <input type="text" id="userId" value="chenliang" placeholder="输入 userId">
            </div>
        </header>

        <section class="assistant-bar">
            <button class="assistant-card active" data-assistant="default" type="button">
                <strong>通用助手</strong>
                <span>处理普通业务咨询、通用问答和会话交流。</span>
            </button>
            <button class="assistant-card" data-assistant="dict" type="button">
                <strong>字典助手</strong>
                <span>处理字典主项、字典子项和字典维护类对话。</span>
            </button>
        </section>

        <section class="chat-container" id="chat-container"></section>

        <section class="composer">
            <form class="composer-form" id="chat-form">
                <input type="text" id="message-input" autocomplete="off" placeholder="输入消息后发送">
                <button class="send-btn" id="send-btn" type="submit">↑</button>
            </form>
        </section>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
    function preprocessMarkdown(text) {
        if (!text.includes('|') || !text.includes('---')) {
            return text;
        }

        const processed = text.replace(/\|\|/g, '|\n|');
        const lines = processed.split('\n');
        const finalLines = [];

        for (let line of lines) {
            line = line.trim();
            if (!line) {
                continue;
            }

            if (!line.includes('|')) {
                finalLines.push(line);
                continue;
            }

            const firstPipeIndex = line.indexOf('|');
            const lastPipeIndex = line.lastIndexOf('|');

            if (firstPipeIndex > 0) {
                const prefix = line.substring(0, firstPipeIndex).trim();
                if (prefix) {
                    finalLines.push(prefix);
                }
            }

            finalLines.push(line.substring(firstPipeIndex, lastPipeIndex + 1));

            if (lastPipeIndex < line.length - 1) {
                const suffix = line.substring(lastPipeIndex + 1).trim();
                if (suffix) {
                    finalLines.push(suffix);
                }
            }
        }

        return finalLines.join('\n');
    }

    marked.setOptions({
        gfm: true,
        tables: true,
        breaks: true,
        highlight(code, lang) {
            const language = hljs.getLanguage(lang) ? lang : 'plaintext';
            return hljs.highlight(code, { language }).value;
        }
    });

    const EMPTY_STATE_HTML = `
        <div class="message ai">
            <div class="bubble">
                <p>当前会话下还没有这个助手的历史消息。</p>
                <p>你可以直接发送消息，系统会按照当前选中的助手发起请求。</p>
            </div>
        </div>
    `;

    const chatContainer = document.getElementById('chat-container');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const userIdInput = document.getElementById('userId');
    const sendBtn = document.getElementById('send-btn');
    const sessionList = document.getElementById('session-list');
    const newChatBtn = document.getElementById('new-chat-btn');
    const assistantCards = document.querySelectorAll('.assistant-card');
    const currentSessionBadge = document.getElementById('current-session-badge');
    const currentAssistantBadge = document.getElementById('current-assistant-badge');

    let currentSessionId = null;
    let currentAssistantType = 'default';
    let sessionListData = [];

    function setActiveAssistantCard(assistantType) {
        assistantCards.forEach(card => {
            const isActive = (card.dataset.assistant || 'default') === assistantType;
            card.classList.toggle('active', isActive);
        });
        currentAssistantBadge.innerHTML = `当前助手: <strong>${assistantType === 'dict' ? '字典助手' : '通用助手'}</strong>`;
    }

    function updateSessionBadge() {
        const activeSession = sessionListData.find(session => session.id === currentSessionId);
        if (!activeSession) {
            currentSessionBadge.innerHTML = '当前会话: <strong>未选择</strong>';
            return;
        }
        currentSessionBadge.innerHTML = `当前会话: <strong>${activeSession.sessionName}</strong>`;
    }

    function renderEmptyState() {
        chatContainer.innerHTML = EMPTY_STATE_HTML;
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function appendMessage(role, text, scroll = true) {
        const message = document.createElement('div');
        message.className = `message ${role}`;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        if (role === 'ai') {
            bubble.innerHTML = `${marked.parse(preprocessMarkdown(text))}<span class="typing-cursor"></span>`;
        } else if (role === 'tool_execution_result') {
            bubble.textContent = text;
        } else {
            bubble.textContent = text;
        }

        message.appendChild(bubble);
        chatContainer.appendChild(message);

        if (scroll) {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        return bubble;
    }

    async function loadSessionMessages(sessionId) {
        chatContainer.innerHTML = '';

        try {
            const response = await fetch(`/session/messages?sessionId=${sessionId}&assistantType=${encodeURIComponent(currentAssistantType)}`);
            const messages = await response.json();

            if (!Array.isArray(messages) || messages.length === 0) {
                renderEmptyState();
                return;
            }

            messages.forEach(message => appendMessage(message.role, message.content, false));
            chatContainer.scrollTop = chatContainer.scrollHeight;
        } catch (error) {
            console.error('加载会话消息失败:', error);
            renderEmptyState();
        }
    }

    function renderSessionList() {
        sessionList.innerHTML = '';

        sessionListData.forEach((session, index) => {
            const item = document.createElement('button');
            item.type = 'button';
            item.className = `session-item ${session.id === currentSessionId ? 'active' : ''}`;
            item.innerHTML = `
                <div class="session-index">会话 ${index + 1}</div>
                <div class="session-name">${session.sessionName}</div>
            `;
            item.addEventListener('click', async () => {
                currentSessionId = session.id;
                renderSessionList();
                updateSessionBadge();
                await loadSessionMessages(session.id);
            });
            sessionList.appendChild(item);
        });

        updateSessionBadge();
    }

    async function createNewSession() {
        const userId = userIdInput.value.trim();
        if (!userId) {
            return;
        }

        const response = await fetch('/session/create', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: `userId=${encodeURIComponent(userId)}&sessionName=${encodeURIComponent('新会话')}`
        });

        const newSession = await response.json();
        currentSessionId = newSession.id;
        await loadSessionList();
    }

    async function loadSessionList() {
        const userId = userIdInput.value.trim();
        if (!userId) {
            currentSessionId = null;
            sessionListData = [];
            sessionList.innerHTML = '';
            chatContainer.innerHTML = '';
            updateSessionBadge();
            return;
        }

        try {
            const response = await fetch(`/session/list?userId=${encodeURIComponent(userId)}`);
            sessionListData = await response.json();

            if (sessionListData.length === 0) {
                await createNewSession();
                return;
            }

            if (!currentSessionId || !sessionListData.some(session => session.id === currentSessionId)) {
                currentSessionId = sessionListData[0].id;
            }

            renderSessionList();
            await loadSessionMessages(currentSessionId);
        } catch (error) {
            console.error('加载会话列表失败:', error);
        }
    }

    function validateUserId() {
        const userId = userIdInput.value.trim();
        const isValid = userId.length > 0;
        messageInput.disabled = !isValid;
        sendBtn.disabled = !isValid;
        newChatBtn.disabled = !isValid;
        messageInput.placeholder = isValid ? '输入消息后发送' : '请先输入 userId';

        if (isValid) {
            loadSessionList();
        } else {
            sessionList.innerHTML = '';
            chatContainer.innerHTML = '';
            currentSessionId = null;
            updateSessionBadge();
        }
    }

    assistantCards.forEach(card => {
        card.addEventListener('click', async () => {
            currentAssistantType = card.dataset.assistant || 'default';
            setActiveAssistantCard(currentAssistantType);
            if (currentSessionId) {
                await loadSessionMessages(currentSessionId);
            }
        });
    });

    chatForm.addEventListener('submit', async event => {
        event.preventDefault();

        const message = messageInput.value.trim();
        const userId = userIdInput.value.trim();
        if (!message || !userId || !currentSessionId) {
            return;
        }

        if (chatContainer.textContent.includes('当前会话下还没有这个助手的历史消息')) {
            chatContainer.innerHTML = '';
        }

        appendMessage('user', message);
        messageInput.value = '';

        const aiBubble = appendMessage('ai', '思考中...');
        let fullText = '';

        try {
            const url = `/streamingAssistant?userId=${encodeURIComponent(userId)}&sessionId=${currentSessionId}&message=${encodeURIComponent(message)}&assistantType=${encodeURIComponent(currentAssistantType)}`;
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error((await response.text()) || '服务连接中断');
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            aiBubble.innerHTML = '';
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) {
                    break;
                }

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed.startsWith('data:')) {
                        continue;
                    }

                    const data = trimmed.replace(/^data:\s?/, '').replace(/\\n/g, '\n');
                    fullText += data;
                    aiBubble.innerHTML = `${marked.parse(preprocessMarkdown(fullText))}<span class="typing-cursor"></span>`;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            }

            if (buffer.startsWith('data:')) {
                fullText += buffer.replace(/^data:\s?/, '').replace(/\\n/g, '\n');
            }

            aiBubble.innerHTML = marked.parse(preprocessMarkdown(fullText));
        } catch (error) {
            console.error(error);
            aiBubble.innerHTML = `
                <div style="padding:14px 16px; border-radius:14px; border:1px solid rgba(248, 113, 113, 0.35); background:rgba(127, 29, 29, 0.18); color:#fecaca;">
                    <strong>系统错误:</strong> ${error.message}
                </div>
            `;
        }
    });

    newChatBtn.addEventListener('click', async () => {
        try {
            await createNewSession();
        } catch (error) {
            console.error('创建会话失败:', error);
        }
    });

    userIdInput.addEventListener('input', validateUserId);

    setActiveAssistantCard(currentAssistantType);
    updateSessionBadge();
    validateUserId();
</script>
</body>
</html>
