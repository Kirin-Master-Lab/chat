## 数据库连接配置 (MySQL)
#spring.datasource.url=jdbc:mysql://127.0.0.1:3307/chenliang?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
#spring.datasource.username=root
#spring.datasource.password=root1234
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#
## 显式指定数据源类型
#spring.datasource.type=com.alibaba.druid.pool.DruidDataSource

# --- 基础连接配置 ---
spring.datasource.druid.driver-class-name=${database.driverClassName}
spring.datasource.druid.url=jdbc:${database.type}://${database.chat.url}/${database.chat.dbname}?useUnicode=true&characterEncoding=utf-8&useSSL=false
spring.datasource.druid.username=${database.chat.username}
spring.datasource.druid.password=${database.chat.password}

# --- 连接池调优 ---
# 初始化时建立物理连接的个数
spring.datasource.druid.initial-size=5
# 最小连接池数量
spring.datasource.druid.min-idle=5
# 最大活跃连接数
spring.datasource.druid.max-active=40
# 获取连接时最大等待时间（毫秒）
spring.datasource.druid.max-wait=60000

# --- 检测与回收 ---
# 毁坏线程检测间隔
spring.datasource.druid.time-between-eviction-runs-millis=60000
# 连接在池中最小生存时间
spring.datasource.druid.min-evictable-idle-time-millis=300000
# 用来检测连接是否有效的sql
spring.datasource.druid.validation-query=SELECT 1
# 申请连接时检测，空闲时间大于间隔才执行检测
spring.datasource.druid.test-while-idle=true
# 借出时不检测（提高性能）
spring.datasource.druid.test-on-borrow=false
# 归还时不检测
spring.datasource.druid.test-on-return=false

# --- 监控与插件 ---
# stat: 监控统计; wall: 防火墙; slf4j: 日志打印
spring.datasource.druid.filters=stat,wall,slf4j

# --- 开启内置监控页面 ---
spring.datasource.druid.stat-view-servlet.enabled=true
spring.datasource.druid.stat-view-servlet.url-pattern=/druid/*
# 如果需要登录密码，取消下面两行注释
# spring.datasource.druid.stat-view-servlet.login-username=admin
# spring.datasource.druid.stat-view-servlet.login-password=admin




database.type= mysql
database.driverClassName= com.mysql.cj.jdbc.Driver

